# Installed into the fork's .github/workflows/ (Task 4.1). Deliberately thin: all
# real work - running pip-audit, deduping against the findings table, filing and
# labeling issues - happens in the orchestrator itself (POST /scan/run, see
# IMPLEMENTATION_PLAN.md §8.5a). This workflow's only job is to trigger it on a
# schedule or on demand, so a second component never independently computes
# finding fingerprints (issue-as-pointer principle, IMPLEMENTATION_PLAN.md §0).
#
# Requires two repo secrets on the fork:
#   ORCHESTRATOR_URL  - the orchestrator's current reachable URL (the cloudflared
#                        tunnel from Task 4.2). Not stable across restarts unless
#                        a fixed subdomain is used - update this secret when it changes.
#   WEBHOOK_SECRET     - same value as the orchestrator's own WEBHOOK_SECRET env var,
#                        sent as a bearer token. POST /scan/run isn't a GitHub-signed
#                        webhook, so it needs its own auth check.
name: Dependency CVE scan

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  trigger-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger orchestrator scan
        run: |
          curl --fail-with-body -sS -X POST "${ORCHESTRATOR_URL}/scan/run" \
            -H "Authorization: Bearer ${WEBHOOK_SECRET}"
        env:
          ORCHESTRATOR_URL: ${{ secrets.ORCHESTRATOR_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
